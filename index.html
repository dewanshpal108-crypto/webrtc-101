<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Webrtc</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel='stylesheet' type='text/css' media='screen' href='styles.css'>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="identity-pill">
                <span class="label">You</span>
                <strong id="user-name">Guest</strong>
            </div>

            <div class="controls">
                <button id="call" class="action-button primary">Call</button>
                <button id="hangup" class="action-button secondary">Hangup</button>
            </div>

            <div id="answer" class="incoming-calls" aria-live="polite"></div>
        </header>

        <main id="videos" class="video-grid">
            <section class="video-card local-card">
                <div class="video-title">Local camera</div>
                <div id="video-wrapper" class="video-stage">
                    <div id="waiting" class="waiting-badge">Waiting for answer...</div>
                    <video class="video-player" id="local-video" autoplay playsinline></video>
                </div>
            </section>

            <section class="video-card remote-card">
                <div class="video-title">Remote video</div>
                <video class="video-player" id="remote-video" autoplay playsinline></video>
            </section>
        </main>
    </div>
</body>
<script src="/socket.io/socket.io.js"></script>
<script src='scripts.js'></script>
<script src='socketListeners.js'></script>
</html>
