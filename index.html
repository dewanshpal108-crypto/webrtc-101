<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Call</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="identity-pill">
                <span class="label">
                    You
                </span>
                <strong id="user-name">
                    Guest
                </strong>
            </div>
            <div class="controls">
                <button id="call" class="action-button primary" type="button">
                    Call
                </button>
                <button id="hangup" class="action-button secondary" type="button">
                    Hangup
                </button>
            </div>
            <div id="share-container" class="incoming-calls" aria-live="polite">
            </div>
        </header>
        <main id="videos" class="video-grid">
            <!-- Local Video -->
            <section class="video-card local-card">
                <div class="video-title">
                    Local camera
                </div>
                <div id="video-wrapper" class="video-stage">
                    <div id="waiting" class="waiting-badge">
                        Waiting for answer...
                    </div>
                    <video class="video-player" id="local-video" autoplay playsinline muted></video>
                </div>
            </section>

            <!-- Remote Video -->
            <section class="video-card remote-card">
                <div class="video-title">
                    Remote video
                </div>
                <div class="video-stage">
                    <video class="video-player" id="remote-video" autoplay playsinline></video>
                </div>
            </section>
        </main>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts.js"></script>
    <script src="/socketListeners.js"></script>
</body>
</html>
